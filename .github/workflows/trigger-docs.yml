name: 通知主站部署文档

on:
  push:
    branches:
      - main
    paths:
      - "history/*.md"
      - "history/images/**"

permissions:
  contents: read

jobs:
  notify-docs-site:
    name: 通知主站重新构建
    runs-on: ubuntu-latest
    steps:
      - name: 生成 GitHub App 短期令牌
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOC_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.DOC_PUBLISHER_PRIVATE_KEY }}
          owner: micro-scaff
          repositories: micro-scaff.github.io

      - name: 发送文档发布事件
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --url "https://api.github.com/repos/micro-scaff/micro-scaff.github.io/dispatches" \
            --data "{\"event_type\":\"docs-published\",\"client_payload\":{\"sourceRepository\":\"Not-have/learn\",\"sourceCommit\":\"${SOURCE_SHA}\"}}"
